# Locksmith product surface contract (qa/README.md).
# Every route literal in src/ and every `locksmith` leaf command must appear
# here; `python qa/run.py` fails closed otherwise. `refusals` lists the
# documented error codes a route can return; an entry counts as exercised
# only when a passing positive case and passing refusal cases producing
# every listed code cover it. Known gaps need a ticket and an expiry of at
# most 30 days, and only the owner approves them.
version: 1
floors:
  HEALTH: 4
  ENROL: 5
  PROXY: 6
  AGT: 44
  ADM: 50
  CAT: 48
  TLS: 41
  NAT: 44
  OAU: 31
  DMN: 44
  RTE: 8
