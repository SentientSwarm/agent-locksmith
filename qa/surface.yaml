behaviours:
- id: beh.config.validation
  summary: 'Config load: ${VAR} expansion, deprecations, deny_unknown_fields; invalid config exits 1'
- id: beh.config.restart-only
  summary: Config file and operator credentials read once at startup; no reload
- id: beh.daemon.single-instance
  summary: Second daemon on the same database is refused (advisory lock)
- id: beh.migrations.forward-only
  summary: Embedded migrations apply on start; a prior binary refuses a newer schema
- id: beh.seed.catalog
  summary: Seed catalog and legacy config.tools bootstrap into registrations
- id: beh.creds.startup-resolution
  summary: Credentials resolved at startup; unresolved config credentials fail readiness
- id: beh.retention.audit-and-logs
  summary: Audit and operational-log retention sweepers delete expired rows
- id: beh.retention.credential-store
  summary: Credential-store sweeper tombstones then deletes unreferenced sealed values
- id: beh.oauth.refresh-task
  summary: Background OAuth refresh before expiry; recovery barrier
- id: beh.shutdown.drain
  summary: SIGTERM/SIGINT drain window; any listener exiting early stops the daemon
- id: beh.audit.jsonl-mirror
  summary: Audit rows mirrored to a rotating JSONL file
- id: beh.oplog.store
  summary: Operational log events stored and queryable
- id: beh.egress.proxied
  summary: 'egress: proxied routes upstream calls through the CONNECT proxy'
- id: beh.tls.upstream-ca
  summary: tls.upstream_ca_bundle adds trust roots for HTTPS upstreams
- id: beh.response-controls
  summary: Size cap, content-type allowlist and redaction (hash only in audit)
- id: beh.codex.fixups
  summary: Codex account header, /responses body fixup and required headers
- id: beh.route.backends
  summary: Switching a route's backend keeps grants and moves bindings with the backend
- id: beh.route.profile
  summary: Route profile selects Codex wire behaviour; NULL infers from upstream
- id: beh.proxy.header-strip
  summary: Agent Authorization, x-api-key and target auth header are stripped
- id: beh.secret.backends
  summary: env, file-sealed, op, stored backends resolve; file-sealed rejects loose modes
- id: beh.mtls.identity
  summary: mTLS cert identity (CN, SAN DNS, SAN URI) maps to an agent
- id: beh.mtls.revocation
  summary: CRL and blocklist refuse revoked certs; no CRL in force refuses mTLS
  audit_causes:
  - crl_unavailable
  - revoked_by_crl
  - revoked_by_blocklist
- id: beh.readyz.semantics
  summary: /readyz refuses identityless credentialed setups and unresolved config credentials
- id: beh.native.limits
  summary: Native MCP session limits, deadlines and Origin/Host allowlists
- id: beh.telemetry.logging
  summary: JSON logs at logging.level, optional logging.file
- id: beh.bootstrap-listener
  summary: bootstrap_only listener binds and enrols with a bootstrap token
journeys: []
known_gaps: []
