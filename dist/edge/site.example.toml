# Example site file for dist/edge. Copy it into your PRIVATE site repo
# and replace every value. The names and the RFC 5737 documentation
# addresses below are placeholders, not a real deployment.

[site]
# Each instance's state lives on its own volume mounted here.
state_root = "/srv/locksmith-edge"
# Refuse to start a component unless state_root is a separate ZFS mount.
require_zfs = true

[[instance]]
name = "lab-locksmith"
address = "192.0.2.10"
cpu = 2
memory = "4GiB"

[[instance.component]]
name = "locksmith"
user = "locksmith"
command = "/usr/local/bin/locksmithd --config /srv/locksmith-edge/locksmith/config.yaml"
environment_file = true
ingress = [{ port = 9200, from = ["198.51.100.0/24"] }]

# A classifier sidecar must share Locksmith's container and user: Locksmith
# reaches it only over a Unix socket and checks the peer's uid. Point
# inspection.sidecars[].socket at the same path.
[[instance.component]]
name = "inspector"
user = "locksmith"
command = "/opt/locksmith-inspector/venv/bin/python -I /opt/locksmith-inspector/locksmith_inspector.py --socket /run/locksmith-edge/inspector/inspector.sock"
env = { HF_HOME = "/srv/locksmith-edge/models/inspector", HF_HUB_OFFLINE = "1" }
jit = true

[[instance]]
name = "lab-pipelock"
address = "192.0.2.11"
cpu = 1
memory = "1GiB"

[[instance.component]]
name = "pipelock"
user = "pipelock"
command = "/usr/local/bin/pipelock run --config /srv/locksmith-edge/pipelock/config.yaml"
ingress = [{ port = 8888, from = ["192.0.2.10/32"] }]
