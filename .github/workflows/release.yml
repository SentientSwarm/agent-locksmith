name: Release

# A v* tag publishes the bytes native validation built and smoke-tested: the
# CLI and daemon for four targets, SHA256SUMS and validation.json, with notes
# from CHANGELOG.md. Pull requests that change the release path and manual runs
# do everything except publish.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/native-validation.yml
      - scripts/release-notes.py
      - scripts/native-validate.py
      - scripts/native_validation/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/native-validation.yml

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-complete-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Check assets and version, write notes
        run: |
          python3 -B scripts/release-notes.py --assets "$RUNNER_TEMP/release" \
            --ref "$GITHUB_REF" --out "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            locksmith-* locksmithd-* SHA256SUMS validation.json
