name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify vendored SDK before native compilation
        run: |
          python3 crates/mcp-transport/vendor/check.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Qualify pinned native Python consumer
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/native-python"
          uv pip install --python "$RUNNER_TEMP/native-python/bin/python" -r tests/native_process/requirements.txt
          "$RUNNER_TEMP/native-python/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import pathlib
          import sys
          assert sys.version_info[:2] == (3, 13), "Python 3.13 required"
          requirements = pathlib.Path("tests/native_process/requirements.txt").read_text().splitlines()
          assert len(requirements) == 28
          for requirement in requirements:
              name, expected = requirement.split("==")
              assert metadata.version(name) == expected, name
          assert metadata.version("mcp") == "2.3.0"
          print(json.dumps({"qualified_packages": 28, "mcp": "2.3.0", "python": "3.13"}))
          PY
          printf 'LOCKSMITH_NATIVE_PYTHON=%s\n' "$RUNNER_TEMP/native-python/bin/python" >> "$GITHUB_ENV"
      - name: Verify consuming-root SDK resolution
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/native-root-metadata.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          packages = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "native-root-metadata.json").read_text())["packages"]
          rmcp = [p for p in packages if p["name"] == "rmcp"]
          assert len(rmcp) == 1 and rmcp[0]["version"] == "3.7.0"
          assert rmcp[0]["source"] is None
          assert pathlib.Path(rmcp[0]["manifest_path"]).resolve() == root / "crates/mcp-transport/vendor/rmcp/Cargo.toml"
          package = [p for p in packages if p["name"] == "agent-locksmith"]
          assert len(package) == 1 and package[0]["version"] == "2.8.0"
          print("root rmcp resolves to the qualified local ownership patch; root package remains 2.8.0")
          PY
      - name: Check out pinned pre-0010 source
        uses: actions/checkout@v4
        with:
          ref: fa2f4d5835a053bf2377e09948d8458017302835
          path: prior-source
          persist-credentials: false
      - name: Preserve the pinned pre-0010 daemon
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/prior-source" rev-parse HEAD)" = "fa2f4d5835a053bf2377e09948d8458017302835"
          cargo build --locked --manifest-path "$GITHUB_WORKSPACE/prior-source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target" --bin locksmithd
          mkdir -p "$RUNNER_TEMP/pre-0010-fa2f4d5"
          cp "$GITHUB_WORKSPACE/target/debug/locksmithd" "$RUNNER_TEMP/pre-0010-fa2f4d5/locksmithd"
          printf 'source_commit=fa2f4d5835a053bf2377e09948d8458017302835\n' > "$RUNNER_TEMP/pre-0010-fa2f4d5/PROVENANCE.txt"
          sha256sum "$RUNNER_TEMP/pre-0010-fa2f4d5/locksmithd" >> "$RUNNER_TEMP/pre-0010-fa2f4d5/PROVENANCE.txt"
          cat "$RUNNER_TEMP/pre-0010-fa2f4d5/PROVENANCE.txt"
      - name: Check out pinned pre-0011 source
        uses: actions/checkout@v4
        with:
          ref: 205a7359714bfaee22ac4ee2a64508400bfcb352
          path: native-prior-source
          persist-credentials: false
      - name: Preserve the pinned pre-0011 daemon and CLI
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/native-prior-source" rev-parse HEAD)" = "205a7359714bfaee22ac4ee2a64508400bfcb352"
          cargo build --locked --manifest-path "$GITHUB_WORKSPACE/native-prior-source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target" --bin locksmithd --bin locksmith
          mkdir -p "$RUNNER_TEMP/pre-0011-205a735"
          cp "$GITHUB_WORKSPACE/target/debug/locksmithd" "$RUNNER_TEMP/pre-0011-205a735/locksmithd"
          cp "$GITHUB_WORKSPACE/target/debug/locksmith" "$RUNNER_TEMP/pre-0011-205a735/locksmith"
          printf 'source_commit=205a7359714bfaee22ac4ee2a64508400bfcb352\n' > "$RUNNER_TEMP/pre-0011-205a735/PROVENANCE.txt"
          sha256sum "$RUNNER_TEMP/pre-0011-205a735/locksmithd" "$RUNNER_TEMP/pre-0011-205a735/locksmith" >> "$RUNNER_TEMP/pre-0011-205a735/PROVENANCE.txt"
          cat "$RUNNER_TEMP/pre-0011-205a735/PROVENANCE.txt"
      - run: cargo test --all
      - name: Verify OAuth upgrade and prior-binary refusal
        run: |
          LOCKSMITH_PRIOR_DAEMON="$RUNNER_TEMP/pre-0010-fa2f4d5/locksmithd" cargo test --locked --test explicit_binding_smoke_test actual_daemon_oauth_upgrade_and_prior_binary_refusal -- --ignored --exact --nocapture
      - name: Verify native upgrade and prior-binary refusal
        run: |
          LOCKSMITH_NATIVE_PRIOR_DAEMON="$RUNNER_TEMP/pre-0011-205a735/locksmithd" cargo test --locked --test explicit_binding_smoke_test actual_daemon_native_upgrade_and_prior_binary_refusal -- --ignored --exact --nocapture
      - name: Require actual pinned Python native lifecycle proof
        run: |
          set -o pipefail
          cargo test --locked --test native_process_test -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-process.log"
          python3 - "$RUNNER_TEMP/native-process.log" <<'PY'
          import json
          import pathlib
          import sys
          text = pathlib.Path(sys.argv[1]).read_text()
          assert "Python consumer skipped" not in text, "Python skip is not acceptance"
          expected = {"client": "mcp-python-2.3.0", "tls_verified": True, "initialize_list_ping_denial_close": "PASS"}
          proofs = []
          for line in text.splitlines():
              start = line.find('{"client":')
              if start >= 0:
                  value, end = json.JSONDecoder().raw_decode(line[start:])
                  proofs.append(value)
          assert expected in proofs, "missing actual pinned Python TLS lifecycle proof"
          print(json.dumps(expected))
          PY
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
      - name: Bounded MCP transport (separate integration prerequisite)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked --manifest-path crates/mcp-transport/Cargo.toml
          cargo clippy --locked --manifest-path crates/mcp-transport/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/mcp-transport/Cargo.toml --check
