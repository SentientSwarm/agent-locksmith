[package]
name = "agent-locksmith"
version = "3.0.0"
edition = "2024"
description = "Secure proxy for AI agent tool access with credential injection"
license = "MIT"
repository = "https://github.com/SentientSwarm/agent-locksmith"
# Test binaries are listed below; see docs/development/local-ci.md#test-binaries.
autotests = false

[[bin]]
name = "locksmithd"
path = "src/main.rs"

[[bin]]
name = "locksmith"
path = "src/cli/main.rs"

[[bench]]
name = "audit_write_bench"
harness = false
path = "benches/audit_write_bench.rs"

[dependencies]
libc = "=0.2.183"
locksmith-mcp-transport = { path = "crates/mcp-transport" }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
tokio-util = { version = "0.7", features = ["rt"] }

aes-gcm = "0.10"
arc-swap = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
bytes = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
getrandom = "0.3"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
regex = "1"
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }
pem = "3"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }

time = "0.3"

[dev-dependencies]
reqwest_mcp = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["rustls-no-provider"] }
axum-test = "19"
criterion = { version = "0.5", features = ["async_tokio"] }
rcgen = "0.13"
tempfile = "3"
time = { version = "0.3", features = ["macros"] }
tokio-test = "0.4"
wiremock = "0.6"

[patch.crates-io]
rmcp = { path = "crates/mcp-transport/vendor/rmcp" }

# Build-time artifacts (proc macros, build scripts) keep their symbols.
# Cargo's release default strips debuginfo, and the macOS 27 `strip`
# corrupts proc-macro dylibs such as sqlx-macros ("mis-aligned
# LINKEDIT"). Shipped binaries keep the default release stripping.
# AGENT-218.
[profile.release.build-override]
strip = false


# Grouped integration test binaries: each includes several test files by path.
[[test]]
name = "admin_suite"
path = "tests/admin_suite.rs"

[[test]]
name = "catalog_suite"
path = "tests/catalog_suite.rs"

[[test]]
name = "mtls_suite"
path = "tests/mtls_suite.rs"

[[test]]
name = "native_suite"
path = "tests/native_suite.rs"

[[test]]
name = "oauth_suite"
path = "tests/oauth_suite.rs"

[[test]]
name = "proxy_suite"
path = "tests/proxy_suite.rs"

# Standalone: they start real daemon, CLI or SDK processes (kept apart so their
# timing-sensitive startup does not compete with a whole suite), change
# process-wide state, re-run their own binary, resolve modules from the crate
# root, or are named by CI and the docs.
[[test]]
name = "admin_https_mtls_e2e_test"
path = "tests/admin_https_mtls_e2e_test.rs"

[[test]]
name = "agent_listener_mtls_e2e_test"
path = "tests/agent_listener_mtls_e2e_test.rs"

[[test]]
name = "bootstrap_only_daemon_test"
path = "tests/bootstrap_only_daemon_test.rs"

[[test]]
name = "broker_daemon_test"
path = "tests/broker_daemon_test.rs"

[[test]]
name = "build_identity_test"
path = "tests/build_identity_test.rs"

[[test]]
name = "cli_e2e_test"
path = "tests/cli_e2e_test.rs"

[[test]]
name = "credential_store_e2e_test"
path = "tests/credential_store_e2e_test.rs"

[[test]]
