path = "tests/daemon_listener_startup_test.rs"

[[test]]
name = "daemon_runtime_test"
path = "tests/daemon_runtime_test.rs"

[[test]]
name = "definition_process_test"
path = "tests/definition_process_test.rs"

[[test]]
name = "env_expansion_test"
path = "tests/env_expansion_test.rs"

[[test]]
name = "explicit_account_bindings_test"
path = "tests/explicit_account_bindings_test.rs"

[[test]]
name = "explicit_binding_smoke_test"
path = "tests/explicit_binding_smoke_test.rs"

[[test]]
name = "inference_matrix_cloud_test"
path = "tests/inference_matrix_cloud_test.rs"

[[test]]
name = "mtls_revocation_daemon_test"
path = "tests/mtls_revocation_daemon_test.rs"

[[test]]
name = "native_compact_process_test"
path = "tests/native_compact_process_test.rs"

[[test]]
name = "native_compact_sdk_test"
path = "tests/native_compact_sdk_test.rs"

[[test]]
name = "native_context_process_test"
path = "tests/native_context_process_test.rs"

[[test]]
name = "native_dispatch_process_test"
path = "tests/native_dispatch_process_test.rs"

[[test]]
name = "native_oauth_test"
path = "tests/native_oauth_test.rs"

[[test]]
name = "native_preparation_process_test"
path = "tests/native_preparation_process_test.rs"

[[test]]
name = "native_process_test"
path = "tests/native_process_test.rs"

[[test]]
name = "native_skill_process_test"
path = "tests/native_skill_process_test.rs"

[[test]]
